[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "equitylens"
version = "0.1.0"
description = "A research dashboard for exploring ASX stocks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3.0",
  "pandas>=2.2,<3.0",
  "plotly>=6.0,<7.0",
  "python-dotenv>=1.0,<2.0",
  "scikit-learn>=1.6,<2.0",
  "streamlit>=1.42,<2.0",
  "yfinance>=0.2.54,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.11,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/equitylens"]

[tool.uv]
# Day 1 runs directly from src; packaging and deployment metadata come later.
package = true

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
